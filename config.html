<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>敌人 / Boss 配置管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin-right: 8px; }
  button, .btn { background: #21262d; color: #e6edf3; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
  button:hover, .btn:hover { background: #30363d; }
  #btnSave { background: #238636; border-color: #2ea043; }
  .status { color: #7ee787; font-size: 12px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: 200px 1fr 320px; gap: 0; min-height: calc(100vh - 53px); }
  .sidebar { border-right: 1px solid #30363d; padding: 10px; overflow-y: auto; max-height: calc(100vh - 53px); }
  .grp-title { font-size: 12px; color: #8b949e; margin: 8px 2px 4px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; font-size: 13px; }
  .item:hover { background: #21262d; }
  .item.active { background: #1f6feb33; color: #79c0ff; }
  .item.off { opacity: 0.45; }
  .item .del { color: #f85149; cursor: pointer; padding: 0 4px; font-size: 12px; }
  .add { width: 100%; margin-top: 10px; font-size: 12px; }
  .panel { padding: 14px; overflow-y: auto; max-height: calc(100vh - 53px); }
  .panel h2 { font-size: 15px; margin-bottom: 4px; color: #79c0ff; }
  .panel .desc { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
  .field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .field label { width: 210px; font-size: 13px; color: #c9d1d9; text-align: right; flex-shrink: 0; }
  .field input[type=number] { width: 110px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 5px; padding: 4px 8px; font-size: 13px; }
  .field input[type=checkbox] { width: 16px; height: 16px; }
  .field .unit { font-size: 11px; color: #8b949e; }
  .field.enabled-row { background: #161b22; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; }
  .field.enabled-row label { width: auto; font-weight: 600; }
  .preview { border-left: 1px solid #30363d; display: flex; flex-direction: column; }
  .pv-head { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid #30363d; }
  #pvName { font-size: 13px; color: #79c0ff; flex: 1; }
  canvas { display: block; background: #0a0e14; }
  .pv-hint { font-size: 11px; color: #8b949e; padding: 6px 10px; }
  .msg { position: fixed; top: 60px; right: 20px; background: #238636; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 99; transition: opacity .4s; }
</style>
</head>
<body>
<header>
  <h1>⚙ 敌人 / Boss 配置管理</h1>
  <button id="btnSave">💾 保存到游戏</button>
  <button id="btnExport">📤 导出 JSON</button>
  <button id="btnImport">📥 导入 JSON</button>
  <button id="btnReset">↺ 恢复默认</button>
  <a class="btn" href="hh.html" target="_blank">▶ 打开游戏测试</a>
  <span class="status" id="status"></span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="grp-title">普通敌人</div>
    <div id="listEnemies"></div>
    <div class="grp-title">大型 Boss</div>
    <div id="listBosses"></div>
    <div class="grp-title">全局参数</div>
    <div class="item" data-unit="global">⚙ 全局参数</div>
    <button class="add" id="btnAddEnemy">+ 新增敌人（复制模板）</button>
  </aside>
  <main class="panel" id="form"></main>
  <section class="preview">
    <div class="pv-head">
      <span id="pvName">选择左侧单位进行预览</span>
      <button id="pvPlay">▶ 沙盒演示</button>
      <button id="pvStop">⏹ 停止</button>
    </div>
    <canvas id="pv" width="320" height="380"></canvas>
    <div class="pv-hint">沙盒：真实 AI 运行（预警/攻击/技能），白点 = 假玩家自动移动；敌人 AI 基于本页配置</div>
  </section>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none">

<script src="modular/js/constants.js"></script>
<script src="modular/js/enemy-config.js"></script>
<script src="modular/js/enemies.js"></script>
<script>
(function () {
  const KEY = 'enemy_config_v2'
  const $ = id => document.getElementById(id)
  const deepCopy = o => JSON.parse(JSON.stringify(o))
  const cfgDefault = () => deepCopy(G.ENEMY_CFG || G.ENEMY_CONFIG)

  // 当前编辑配置（从 localStorage 读；无则默认）
  let cfg = null
  try {
    const saved = localStorage.getItem(KEY)
    cfg = saved ? JSON.parse(saved) : null
  } catch (_) {}
  if (!cfg) cfg = cfgDefault()
  else cfg = Object.assign(cfgDefault(), cfg) // 结构兜底

  // 编辑单元列表
  const ENEMY_TYPES = ['melee', 'ranged', 'bomber', 'splitter', 'charger', 'healer', 'sniper', 'shield']
  const ENEMY_NAMES = { melee: '近战怪', ranged: '远程怪', bomber: '自爆怪', splitter: '分裂怪', charger: '冲锋怪', healer: '治疗怪', sniper: '狙击怪', shield: '护盾怪' }
  const ENEMY_COLORS = { melee: '#e8e8e8', ranged: '#7fd4ff', bomber: '#ff6a50', splitter: '#c792ea', charger: '#ffa040', healer: '#5fd06a', sniper: '#5fd6d6', shield: '#6f9dff' }
  const BOSS_LIST = [
    { key: 'normalBoss', name: '普通 Boss' },
    { key: 'meleeBoss', name: '大型近战 Boss' },
    { key: 'artilleryBoss', name: '大型远程 Boss' },
    { key: 'motherBoss', name: '母体 Boss' },
  ]

  // 字段 schema：[中文标签, min, max, step, 单位]
  const SCHEMAS = {
    global: {
      enemyRadius: ['敌人半径', 5, 40, 1], bossRadius: ['普通 Boss 半径', 10, 80, 1],
      meleeBossRadius: ['近战 Boss 半径', 10, 120, 1], meleeBossWindup: ['近战 Boss 蓄力(秒)', 0.1, 5, 0.05],
      meleeBossRecover: ['近战 Boss 后摇(秒)', 0.05, 3, 0.05], meleeBossNovaWindup: ['冲击波蓄力(秒)', 1, 10, 0.5],
      meleeAttackFxLife: ['技能特效时长(秒)', 0.05, 1, 0.01], dashSpeed: ['冲刺速度', 300, 2000, 50],
      enemyProjectileSpeed: ['敌人子弹速度', 100, 800, 10],
      bomberBlastRadius: ['自爆爆炸半径', 40, 300, 5], bomberChargeRadius: ['自爆引爆半径', 40, 250, 5], bomberWindup: ['自爆蓄力(秒)', 0.2, 3, 0.1],
      chargerWindup: ['冲锋蓄力(秒)', 0.2, 3, 0.1], chargerSpeed: ['冲锋速度', 100, 800, 10], chargerDist: ['冲锋距离', 200, 2000, 50], chargerStun: ['冲锋硬直(秒)', 0.5, 5, 0.1],
      healerRange: ['治疗范围', 50, 400, 5], healerAmount: ['治疗量', 0.5, 10, 0.5], healerInterval: ['治疗间隔(秒)', 0.5, 8, 0.5],
      sniperWindup: ['狙击蓄力(秒)', 0.2, 4, 0.1], sniperRange: ['狙击射程', 200, 1500, 50],
    },
    enemyStats: { hpMul: ['生命倍率', 0.1, 5, 0.05], dmgMul: ['伤害倍率', 0.1, 5, 0.05], spdMul: ['移速倍率', 0.1, 5, 0.05] },
    specialType: { wave: ['解锁波次', 1, 60, 1], max: ['每波上限', 1, 20, 1] },
    meleeAttack: { radius: ['范围半径', 50, 600, 5], len: ['长度', 50, 800, 5], halfW: ['半宽', 10, 300, 5], halfAngle: ['扇形半角(弧度)', 0.1, 3.1, 0.05] },
    artillery: {
      radius: ['体型半径', 10, 120, 1], hpBase: ['基础生命', 10, 500, 5], dmgBase: ['基础伤害', 1, 50, 1], speed: ['移速', 5, 80, 1],
      preferredDist: ['保持距离', 100, 800, 10], skillInterval: ['技能间隔(秒)', 0.5, 10, 0.5], windup: ['技能预警(秒)', 0.2, 3, 0.1],
      fanCount: ['扇形子弹数', 3, 60, 1], fanSpeed: ['扇形弹速', 100, 800, 10], fanRadius: ['扇形预警半径', 200, 1000, 20],
      radialCount: ['全屏子弹数', 12, 300, 4], radialSpeed: ['全屏弹速', 100, 800, 10], radialRadius: ['全屏预警半径', 200, 1200, 20],
      bombMin: ['轰炸最少点数', 5, 40, 1], bombMax: ['轰炸最多点数', 5, 40, 1], bombBlastRadius: ['轰炸爆炸半径', 20, 150, 5],
      bombSpeed: ['轰炸下落速度', 400, 3000, 100], cannonSpeed: ['炮弹速度', 50, 400, 10], cannonRadius: ['炮弹半径', 8, 30, 1],
      cannonFuse: ['炮弹引信(秒)', 0.3, 4, 0.1], normalInterval: ['普通攻击间隔(秒)', 0.5, 8, 0.5],
    },
    mother: {
      radius: ['体型半径', 10, 120, 1], hpBase: ['基础生命', 10, 500, 5], dmgBase: ['基础伤害', 1, 50, 1], speed: ['移速', 5, 80, 1], keepDist: ['保持距离', 100, 800, 10],
      venomDmgMul: ['毒液伤害倍率', 0.1, 3, 0.05], venomSpeed: ['毒液弹速', 50, 400, 10], venomCooldown: ['毒液间隔(秒)', 0.5, 6, 0.5],
      venomCooldownEnraged: ['狂暴毒液间隔(秒)', 0.3, 5, 0.1], venomPoisonTime: ['中毒时长(秒)', 1, 8, 0.5], venomPoisonDps: ['中毒每秒伤害', 0.5, 6, 0.1],
      spawnInterval: ['孵化间隔(秒)', 2, 15, 0.5], spawnIntervalEnraged: ['狂暴孵化间隔(秒)', 1, 10, 0.5],
      spawnMin: ['孵化最少', 1, 8, 1], spawnMax: ['孵化最多', 1, 8, 1], spawnMinEnraged: ['狂暴孵化最少', 1, 10, 1], spawnMaxEnraged: ['狂暴孵化最多', 1, 10, 1],
      spawnMaxMinions: ['小怪上限', 1, 20, 1], spawnWarnTime: ['孵化预警(秒)', 0.3, 3, 0.1],
      webCooldown: ['毒雾间隔(秒)', 3, 20, 1], webCooldownEnraged: ['狂暴毒雾间隔(秒)', 2, 15, 1], webRadius: ['毒雾半径', 40, 200, 5],
      webLife: ['毒雾持续(秒)', 1, 8, 0.5], webPoisonTime: ['毒雾中毒时长(秒)', 1, 8, 0.5], webPoisonDps: ['毒雾每秒伤害', 0.3, 5, 0.1],
      shockCooldown: ['冲击波间隔(秒)', 3, 20, 1], shockCooldownEnraged: ['狂暴冲击波间隔(秒)', 2, 15, 1],
      shockCount: ['冲击波弹数', 4, 40, 2], shockCountEnraged: ['狂暴冲击波弹数', 4, 60, 2], shockSpeed: ['冲击波弹速', 50, 400, 10],
      minionRadius: ['小怪半径', 4, 25, 1], minionSpeedBase: ['小怪速度', 30, 250, 5], minionHpMul: ['小怪血量倍率', 0.2, 3, 0.05], minionDmgMul: ['小怪伤害倍率', 0.2, 3, 0.05],
      enrageHpRatio: ['狂暴血量比例', 0.2, 0.9, 0.05], enrageRadiusMul: ['狂暴体型倍率', 1, 2, 0.05],
    },
  }
  // 近战技能名
  const ATTACK_NAMES = { fan: '扇形横摆', slam: '方形拍击', charge: '长条冲击', dash: '冲刺', nova: '圆形冲击波' }
  // 各单元路径与 schema
  function unitPath(u) {
    if (u.type === 'global') return ['cfg', null]
    if (u.type === 'enemy') return ['cfg.enemyStats.' + u.key, 'enabled.' + u.key]
    if (u.type === 'special') return ['cfg.specialTypes.' + u.key, 'enabled.' + u.key]
    if (u.type === 'boss') return [null, 'enabled.' + u.key]
    if (u.type === 'attack') return ['cfg.meleeAttacks.' + u.key, null]
    if (u.type === 'artillery') return ['cfg.artillery', 'enabled.artilleryBoss']
    if (u.type === 'mother') return ['cfg.mother', 'enabled.motherBoss']
    return [null, null]
  }
  function resolve(obj, path) {
    if (!path) return null
    return path.split('.').reduce((o, k) => (o == null ? null : o[k]), obj)
  }
  function setPath(obj, path, val) {
    if (!path) return
    const keys = path.split('.')
    const last = keys.pop()
    let o = obj
    keys.forEach(k => { o = o[k] })
    o[last] = val
  }

  // ---- 列表渲染 ----
  let activeUnit = null
  function renderList() {
    const le = $('listEnemies')
    le.innerHTML = ''
    ENEMY_TYPES.forEach(t => {
      const on = cfg.enabled[t] !== false
      const d = document.createElement('div')
      d.className = 'item' + (activeUnit && activeUnit.type === 'enemy' && activeUnit.key === t ? ' active' : '') + (on ? '' : ' off')
      d.innerHTML = `<span>${ENEMY_NAMES[t]}</span><span class="del" data-del="${t}">✕</span>`
      d.onclick = () => selectUnit({ type: 'enemy', key: t })
      d.querySelector('[data-del]').onclick = (e) => { e.stopPropagation(); delEnemy(t) }
      le.appendChild(d)
    })
    const lb = $('listBosses')
    lb.innerHTML = ''
    BOSS_LIST.forEach(b => {
      const on = cfg.enabled[b.key] !== false
      const d = document.createElement('div')
      d.className = 'item' + (activeUnit && activeUnit.type === 'boss' && activeUnit.key === b.key ? ' active' : '') + (on ? '' : ' off')
      d.textContent = b.name
      d.onclick = () => selectUnit({ type: 'boss', key: b.key })
      lb.appendChild(d)
    })
    // 近战技能入口
    const div = document.createElement('div')
    div.innerHTML = `<div class="grp-title">近战 Boss 技能</div>`
    lb.prepend(div)
    Object.keys(ATTACK_NAMES).forEach(k => {
      const d = document.createElement('div')
      d.className = 'item' + (activeUnit && activeUnit.type === 'attack' && activeUnit.key === k ? ' active' : '')
      d.textContent = '⚔ ' + ATTACK_NAMES[k]
      d.onclick = () => selectUnit({ type: 'attack', key: k })
      lb.appendChild(d)
    })
    const d2 = document.createElement('div')
    d2.className = 'item' + (activeUnit && activeUnit.type === 'artillery' ? ' active' : '')
    d2.textContent = '🎯 远程 Boss 参数'
    d2.onclick = () => selectUnit({ type: 'artillery' })
    lb.appendChild(d2)
    const d3 = document.createElement('div')
    d3.className = 'item' + (activeUnit && activeUnit.type === 'mother' ? ' active' : '')
    d3.textContent = '🦠 母体参数'
    d3.onclick = () => selectUnit({ type: 'mother' })
    lb.appendChild(d3)
  }

  function selectUnit(u) {
    activeUnit = u
    renderList()
    renderForm(u)
  }

  function delEnemy(type) {
    if (!confirm('删除敌人「' + ENEMY_NAMES[type] + '」？删除后该类型不再生成。')) return
    delete cfg.enemyStats[type]
    delete cfg.specialTypes[type]
    cfg.enabled[type] = false
    renderList()
    renderForm(activeUnit)
    flash('已删除（enabled=false，防止恢复默认配置时重新出现）')
  }

  // ---- 表单渲染 ----
  function renderForm(u) {
    const form = $('form')
    if (!u) { form.innerHTML = '<div class="desc">← 从左侧选择要编辑的敌人 / Boss / 全局参数</div>'; return }
    form.innerHTML = ''
    // 标题
    let title = '', desc = ''
    if (u.type === 'global') { title = '⚙ 全局参数'; desc = '所有敌人的公共参数与普通敌人节奏' }
    else if (u.type === 'enemy') { title = ENEMY_NAMES[u.key]; desc = '基础敌人：属性倍率' }
    else if (u.type === 'special') { title = ENEMY_NAMES[u.key]; desc = '特殊敌人：解锁波次与每波上限' }
    else if (u.type === 'boss') { title = BOSS_LIST.find(b => b.key === u.key).name; desc = '是否出场' }
    else if (u.type === 'attack') { title = '⚔ ' + ATTACK_NAMES[u.key]; desc = '近战 Boss 技能范围参数' }
    else if (u.type === 'artillery') { title = '🎯 大型远程 Boss'; desc = '技能与普通攻击参数' }
    else if (u.type === 'mother') { title = '🦠 母体 Boss'; desc = '毒液 / 孵化 / 毒雾 / 冲击波 / 小怪参数' }
    const h2 = document.createElement('h2'); h2.textContent = title; form.appendChild(h2)
    const dp = document.createElement('div'); dp.className = 'desc'; dp.textContent = desc; form.appendChild(dp)
    // 启用开关
    const [p, ep] = unitPath(u)
    if (ep) {
      const row = document.createElement('div'); row.className = 'field enabled-row'
      row.innerHTML = `<label>启用（关闭后完全不出场）</label><input type="checkbox" id="f_enabled" ${resolve(cfg, ep) !== false ? 'checked' : ''}>`
      row.querySelector('#f_enabled').onchange = e => setPath(cfg, ep, e.target.checked)
      form.appendChild(row)
    }
    // 字段（敌人单元 = 属性倍率 + 出场配置两段）
    const sections = []
    if (u.type === 'enemy') {
      sections.push({ path: 'cfg.enemyStats.' + u.key, schema: SCHEMAS.enemyStats })
      if (resolve(cfg, 'cfg.specialTypes.' + u.key)) sections.push({ path: 'cfg.specialTypes.' + u.key, schema: SCHEMAS.specialType })
    } else {
      sections.push({ path: p, schema: SCHEMAS[u.type] || SCHEMAS.global })
    }
    sections.forEach(sec => {
      if (!sec.path) return
      Object.keys(sec.schema).forEach(k => {
        const [label, min, max, step] = sec.schema[k]
        const val = resolve(cfg, sec.path + '.' + k)
        const row = document.createElement('div'); row.className = 'field'
        row.innerHTML = `<label>${label}</label><input type="number" min="${min}" max="${max}" step="${step}" value="${val != null ? val : ''}" data-key="${k}"><span class="unit">${min}~${max}</span>`
        row.querySelector('input').onchange = e => {
          let v = parseFloat(e.target.value)
          if (isNaN(v)) v = 0
          v = Math.max(min, Math.min(max, v))
          setPath(cfg, sec.path + '.' + k, v)
          e.target.value = v
        }
        form.appendChild(row)
      })
    })
    // 预览
    $('pvName').textContent = '预览：' + title
    currentPreviewUnit = u
  }

  // ---- 保存 / 导出 / 导入 / 重置 ----
  function flash(msg) {
    const s = $('status'); s.textContent = msg
    setTimeout(() => { s.textContent = '' }, 3000)
  }
  $('btnSave').onclick = () => {
    try { localStorage.setItem(KEY, JSON.stringify(cfg)) } catch (e) { alert('保存失败：' + e); return }
    flash('✅ 已保存到游戏（localStorage: ' + KEY + '），刷新游戏页面生效')
  }
  $('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob); a.download = 'enemy-config.json'; a.click()
  }
  $('btnImport').onclick = () => $('fileInput').click()
  $('fileInput').onchange = e => {
    const f = e.target.files[0]
    if (!f) return
    const r = new FileReader()
    r.onload = () => { try { cfg = Object.assign(cfgDefault(), JSON.parse(r.result)); renderList(); renderForm(activeUnit); flash('✅ 已导入') } catch (err) { alert('JSON 解析失败：' + err) } }
    r.readAsText(f)
    e.target.value = ''
  }
  $('btnReset').onclick = () => {
    if (!confirm('恢复默认配置？当前配置将被清除。')) return
    localStorage.removeItem(KEY)
    cfg = cfgDefault()
    renderList(); renderForm(activeUnit)
    flash('↺ 已恢复默认（需在游戏中生效需刷新）')
  }
  // 新增敌人（复制 melee 模板）
  $('btnAddEnemy').onclick = () => {
    const id = 'custom' + Date.now().toString().slice(-5)
    cfg.enemyStats[id] = deepCopy(cfg.enemyStats.melee || { hpMul: 1, dmgMul: 1, spdMul: 1 })
    cfg.specialTypes[id] = { wave: 3, max: 2 }
    cfg.enabled[id] = true
    ENEMY_TYPES.push(id)
    ENEMY_NAMES[id] = '自定义怪' + id.slice(-3)
    ENEMY_COLORS[id] = '#c8a2c8'
    renderList()
    selectUnit({ type: 'enemy', key: id })
    flash('✅ 已新增敌人（记得在全局里给 specialTypes 配置出场）')
  }

  // ===== 沙盒预览 =====
  let currentPreviewUnit = null
  const canvas = $('pv')
  const ctx = canvas.getContext('2d')
  // 初始化 EnemySystem（注入 mock 依赖 + 沙盒 state）
  const sand = {
    enemies: [], enemyProjectiles: [], cannonballs: [], webZones: [],
    attackFx: [], motherWarns: [], particles: [], floatTexts: [],
    player: null, wave: 10, flashRed: 0, shakeTimer: 0, _playerSlowed: false,
  }
  EnemySystem.init({
    state: sand,
    worldW: 320,
    worldH: 380,
    view: () => ({ camX: 0, camY: 0, canvasW: 320, canvasH: 380 }),
    gameOver: () => {},
    spawnHitParticles: () => {},
    spawnDeathPowder: () => {},
    spawnFloatText: () => {},
  })
  let pvRunning = false
  let pvRaf = 0
  let pvLast = 0
  const PVP = { x: 160, y: 190, radius: 12, hp: 100, maxHp: 100, facingAngle: 0, facingDir: { x: 1, y: 0 } }
  let pvAngle = 0

  // 构造指定类型敌人（参照 spawnEnemy，读配置；字段兜底防 AI 报错）
  function buildEnemy(type) {
    const st = cfg.enemyStats[type] || cfg.enemyStats.melee
    const hp = Math.max(1, Math.floor(3 * (1 + sand.wave * 0.1) * (st.hpMul || 1)))
    const damage = Math.max(1, Math.floor(4 * (1 + sand.wave * 0.1) * (st.dmgMul || 1)))
    const speed = 45 * (st.spdMul || 1)
    const base = {
      x: 40 + Math.random() * 240, y: 60 + Math.random() * 240, radius: cfg.enemyRadius || 16,
      hp, maxHp: hp, speed, damage, type, isBoss: false, isMotherMinion: false,
      attackCooldown: 0, attackInterval: 2.0, windupTimer: 0, rangedCooldown: 0, preferredDist: type === 'ranged' ? 260 : 40,
      flashTimer: 0, waveId: 1, knockbackX: 0, knockbackY: 0, ghostTimer: 0,
      chargeState: 'idle', chargeState2: 'idle', chargeAngle: 0, chargeDist: 0, chargeWarnTimer: 0, chargeTimer: 0,
      stunTimer: 0, healTimer: 0, sniperWarnTimer: 0, bomberWarnTimer: 0, splitTimer: 0, splitState: 'idle',
      shieldAngle: 0, dashCooldown: 0,
    }
    return base
  }
  function spawnPreview() {
    sand.enemies = []; sand.enemyProjectiles = []; sand.cannonballs = []; sand.webZones = []; sand.motherWarns = []; sand.attackFx = []; sand.particles = []; sand.floatTexts = []
    const u = currentPreviewUnit
    if (!u) return
    const px = 160, py = 190
    if (u.type === 'enemy') {
      sand.enemies.push(buildEnemy(u.key))
    } else if (u.type === 'boss') {
      if (u.key === 'normalBoss') {
        const e = buildEnemy('melee'); e.isBoss = true; e.bossName = '👑 首领'; e.radius = cfg.bossRadius; e.isMeleeBoss = true; e.meleeSkills = ['slam', 'dash']
        sand.enemies.push(e)
      } else if (u.key === 'meleeBoss') {
        sand.state = sand; EnemySystem.spawnMeleeBoss()
        if (sand.enemies.length) { const b = sand.enemies[sand.enemies.length - 1]; b.x = px; b.y = py; b.phaseMode = null }
      } else if (u.key === 'artilleryBoss') {
        sand.state = sand; EnemySystem.spawnArtilleryBoss()
        if (sand.enemies.length) { const b = sand.enemies[sand.enemies.length - 1]; b.x = px; b.y = py; b.phaseMode = null }
      } else if (u.key === 'motherBoss') {
        sand.state = sand; EnemySystem.spawnMotherBoss()
        if (sand.enemies.length) { const b = sand.enemies[sand.enemies.length - 1]; b.x = px; b.y = py; b.phaseMode = null }
      }
    } else if (u.type === 'artillery') {
      sand.state = sand; EnemySystem.spawnArtilleryBoss()
      if (sand.enemies.length) { const b = sand.enemies[sand.enemies.length - 1]; b.x = px; b.y = py; b.phaseMode = null }
    } else if (u.type === 'mother') {
      sand.state = sand; EnemySystem.spawnMotherBoss()
      if (sand.enemies.length) { const b = sand.enemies[sand.enemies.length - 1]; b.x = px; b.y = py; b.phaseMode = null }
    } else if (u.type === 'attack') {
      sand.state = sand; EnemySystem.spawnMeleeBoss()
      if (sand.enemies.length) { const b = sand.enemies[sand.enemies.length - 1]; b.x = px; b.y = py; b.phaseMode = null; b.meleeSkills = [u.key] }
    } else if (u.type === 'global') {
      sand.enemies.push(buildEnemy('melee')); sand.enemies.push(buildEnemy('sniper'))
    }
  }

  // 假玩家绕圈
  function updatePlayer(dt) {
    pvAngle += dt * 0.45
    PVP.x = 160 + Math.cos(pvAngle) * 80
    PVP.y = 190 + Math.sin(pvAngle) * 55
    PVP.facingAngle = Math.atan2(0 - PVP.y, 0 - PVP.x)
    PVP.facingDir = { x: Math.cos(PVP.facingAngle), y: Math.sin(PVP.facingAngle) }
  }
  // 子弹移动
  function updateSand(dt) {
    sand.player = PVP
    for (let i = sand.enemyProjectiles.length - 1; i >= 0; i--) {
      const b = sand.enemyProjectiles[i]
      b.x += b.vx * dt; b.y += b.vy * dt
      b.life -= dt
      if (b.life <= 0 || b.x < -50 || b.x > 370 || b.y < -50 || b.y > 430) sand.enemyProjectiles.splice(i, 1)
    }
    for (let i = sand.particles.length - 1; i >= 0; i--) {
      const p = sand.particles[i]
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt
      if (p.life <= 0) sand.particles.splice(i, 1)
    }
    if (sand.attackFx && sand.attackFx.length) {
      sand.attackFx = sand.attackFx.filter(fx => { fx.life -= dt; return fx.life > 0 })
    }
    if (sand.webZones) { for (let i = sand.webZones.length - 1; i >= 0; i--) { sand.webZones[i].life -= dt; if (sand.webZones[i].life <= 0) sand.webZones.splice(i, 1) } }
    if (sand.motherWarns) { for (let i = sand.motherWarns.length - 1; i >= 0; i--) { sand.motherWarns[i].timer -= dt; if (sand.motherWarns[i].timer <= 0) sand.motherWarns.splice(i, 1) } }
  }

  function renderSand() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1
    for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke() }
    for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke() }
    // 毒雾
    if (sand.webZones) sand.webZones.forEach(z => {
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(60,180,90,0.2)'; ctx.fill()
      ctx.strokeStyle = 'rgba(60,180,90,0.5)'; ctx.stroke()
    })
    // 预警（Boss warn / motherWarns 简化）
    sand.enemies.forEach(e => {
      if (e.warn) {
        ctx.save(); ctx.translate(e.x, e.y)
        if (e.warn.type === 'fan') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, e.warn.radius, e.warn.angle - 0.6, e.warn.angle + 0.6); ctx.closePath(); ctx.fillStyle = 'rgba(255,80,60,0.15)'; ctx.fill() }
        else if (e.warn.type === 'ring') { ctx.beginPath(); ctx.arc(0, 0, e.warn.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,80,60,0.12)'; ctx.fill() }
        else if (e.warn.rect) { ctx.fillStyle = 'rgba(255,80,60,0.12)'; ctx.fillRect(e.warn.rect[0], e.warn.rect[1], e.warn.rect[2], e.warn.rect[3]) }
        ctx.restore()
      }
      if (e.motherWarns) e.motherWarns.forEach(w => {
        if (w.kind === 'web') { ctx.beginPath(); ctx.arc(w.x, w.y, 60, 0, Math.PI * 2); ctx.fillStyle = 'rgba(60,200,90,0.15)'; ctx.fill() }
      })
      if (e.attackState === 'windup' && e.attackType) {
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.attackAngle || 0)
        ctx.fillStyle = 'rgba(255,90,60,0.15)'
        if (e.attackType === 'slam') ctx.fillRect(0, -(cfg.meleeAttacks.slam.halfW), cfg.meleeAttacks.slam.len, cfg.meleeAttacks.slam.halfW * 2)
        if (e.attackType === 'charge' || e.attackType === 'dash') ctx.fillRect(0, -(cfg.meleeAttacks.charge.halfW), cfg.meleeAttacks.charge.len, cfg.meleeAttacks.charge.halfW * 2)
        if (e.attackType === 'fan') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, cfg.meleeAttacks.fan.radius, -cfg.meleeAttacks.fan.halfAngle, cfg.meleeAttacks.fan.halfAngle); ctx.closePath(); ctx.fill() }
        if (e.attackType === 'nova') { ctx.beginPath(); ctx.arc(0, 0, cfg.meleeAttacks.nova.radius, 0, Math.PI * 2); ctx.fill() }
        ctx.restore()
      }
    })
    // 粒子
    sand.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 0.3)
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2)
      ctx.fillStyle = p.color || '#ffcc44'; ctx.fill()
      ctx.globalAlpha = 1
    })
    // 敌人子弹
    sand.enemyProjectiles.forEach(b => {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius || 4, 0, Math.PI * 2)
      ctx.fillStyle = '#ff8855'; ctx.fill()
    })
    // 敌人
    sand.enemies.forEach(e => {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2)
      ctx.fillStyle = (ENEMY_COLORS[e.type] || '#eee') + '33'
      ctx.fill()
      ctx.strokeStyle = ENEMY_COLORS[e.type] || '#eee'; ctx.lineWidth = 2
      ctx.stroke()
      if (e.isBoss) {
        ctx.font = '11px sans-serif'; ctx.fillStyle = '#ffd700'
        ctx.fillText(e.bossName || 'Boss', e.x - 22, e.y - e.radius - 8)
        // 血条
        const w = e.radius * 2
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - w / 2, e.y - e.radius - 4, w, 4)
        ctx.fillStyle = '#ff5555'; ctx.fillRect(e.x - w / 2, e.y - e.radius - 4, w * Math.max(0, e.hp / e.maxHp), 4)
      }
    })
    // 玩家
    ctx.beginPath(); ctx.arc(PVP.x, PVP.y, PVP.radius, 0, Math.PI * 2)
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill()
    ctx.font = '10px sans-serif'; ctx.fillStyle = '#888'
    ctx.fillText('假玩家', PVP.x - 20, PVP.y - PVP.radius - 6)
  }

  function pvLoop(ts) {
    if (!pvRunning) return
    const dt = Math.min(0.05, (ts - pvLast) / 1000 || 0.016)
    pvLast = ts
    updatePlayer(dt)
    try {
      sand.state = sand
      EnemySystem.updateEnemyAI(dt, 1)
    } catch (err) { console.error(err) }
    updateSand(dt)
    renderSand()
    pvRaf = requestAnimationFrame(pvLoop)
  }
  $('pvPlay').onclick = () => {
    if (pvRunning) return
    spawnPreview()
    pvRunning = true
    pvLast = performance.now()
    pvRaf = requestAnimationFrame(pvLoop)
    $('pvPlay').textContent = '▶ 演示中…'
  }
  $('pvStop').onclick = () => {
    pvRunning = false
    cancelAnimationFrame(pvRaf)
    $('pvPlay').textContent = '▶ 沙盒演示'
    sand.enemies = []; sand.enemyProjectiles = []; sand.cannonballs = []; sand.webZones = []; sand.attackFx = []; sand.particles = []; sand.motherWarns = []
    ctx.clearRect(0, 0, canvas.width, canvas.height)
  }

  // 初始化
  renderList()
  renderForm(null)
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)) } catch (_) {} })
})()
</script>
</body>
</html>
