<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ 竞技场 - 生存射击</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ddd;
        }
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* ===== Arena 样式 (从原代码 style.textContent 提取) ===== */
        .arena-root {
            --text: #ddd;
            --border: rgba(255, 255, 255, 0.2);
            --accent: #88ddff;
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #ddd;
        }
        .arena-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.7);
            font-size: 13px;
            letter-spacing: 0.5px;
            color: var(--text);
            flex-shrink: 0;
        }
        .arena-title {
            font-weight: 400;
            color: #fff;
            letter-spacing: 1px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .arena-stats {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #999;
        }
        .arena-stats span {
            color: #ddd;
            font-weight: 300;
        }
        .arena-canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            min-height: 0;
        }
        #arenaCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            cursor: crosshair;
        }

        /* 移动端虚拟摇杆 */
        .joy-base {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.08);
            display: none;
            z-index: 30;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .joy-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        /* 竖屏：中间偏下 */
        @media (orientation: portrait) {
            .joy-base {
                left: 50%;
                bottom: 16%;
                transform: translateX(-50%);
            }
        }
        /* 横屏：左下角 */
        @media (orientation: landscape) {
            .joy-base {
                left: 40px;
                bottom: 40px;
                transform: none;
            }
        }

        /* Boss 血条（支持多 Boss 竖排） */
        .boss-bar {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: min(460px, 78%);
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 15;
            background: rgba(0, 0, 0, 0.55);
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        .boss-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .boss-bar-name {
            font-size: 12px;
            color: #ffd700;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        .boss-bar-track {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            overflow: hidden;
        }
        .boss-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ff8844);
            border-radius: 5px;
            transition: width 0.1s linear;
        }
        .boss-bar-hp {
            font-size: 11px;
            color: #fff;
            font-family: monospace;
            white-space: nowrap;
        }
        .arena-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(2px);
        }
        .arena-modal {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 24px 28px;
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        .arena-modal h2 {
            margin: 0 0 4px 0;
            color: #fff;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 20px;
        }
        .arena-modal .sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .gun-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .gun-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #ddd;
        }
        .gun-card:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
        }
        .gun-card .icon {
            font-size: 28px;
            width: 40px;
            text-align: center;
        }
        .gun-card .info {
            flex: 1;
        }
        .gun-card .name {
            font-weight: 400;
            color: #fff;
            font-size: 16px;
        }
        .gun-card .desc {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .gun-card .stats {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .gun-card .stats span {
            color: #aaa;
        }
        .gun-card .badge {
            padding: 2px 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 10px;
            color: #888;
        }
        .gun-manage-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .manage-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
        }
        .manage-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .manage-card .header .name {
            font-weight: 400;
            color: #fff;
            font-size: 15px;
        }
        .manage-card .header .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .manage-card .details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px 16px;
            font-size: 11px;
            color: #888;
        }
        .manage-card .details span {
            color: #aaa;
        }
        .manage-card .details .label {
            color: #666;
        }
        .manage-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            color: #aaa;
            padding: 2px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .manage-btn:hover {
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        .manage-btn.danger:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .manage-btn.preview:hover {
            border-color: #88ddff;
            color: #88ddff;
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .form-row label {
            font-size: 11px;
            color: #888;
        }
        .form-row input,
        .form-row select {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            padding: 4px 6px;
            color: #ddd;
            font-size: 13px;
            outline: none;
            transition: border 0.15s;
        }
        .form-row input:focus,
        .form-row select:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }
        .form-row select option {
            background: #111;
            color: #ddd;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
        }
        .arena-upgrade-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .arena-upgrade-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #ddd;
            gap: 8px;
        }
        .arena-upgrade-item:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
        }
        .arena-upgrade-item .ug-label {
            font-weight: 300;
            color: #fff;
        }
        .arena-upgrade-item .ug-desc {
            font-size: 12px;
            color: #888;
            text-align: right;
        }
        .arena-upgrade-item.rare {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.05);
        }
        .arena-upgrade-item.rare .ug-label {
            color: #f1c40f;
        }
        .arena-gameover-stats {
            text-align: left;
            padding: 8px 0;
            color: #aaa;
        }
        .arena-gameover-stats p {
            margin: 6px 0;
            font-size: 14px;
        }
        .arena-gameover-stats strong {
            color: #fff;
            font-weight: 300;
        }
        .arena-btn-primary {
            margin-top: 12px;
            padding: 8px 24px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-size: 14px;
            font-weight: 300;
            cursor: pointer;
            transition: all .15s;
            letter-spacing: 1px;
        }
        .arena-btn-primary:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
        .arena-btn-secondary {
            padding: 4px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            transition: all .15s;
        }
        .arena-btn-secondary:hover {
            border-color: #fff;
            color: #fff;
        }
        .arena-config {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
        .arena-config-title {
            font-weight: 300;
            font-size: 14px;
            color: #ccc;
            letter-spacing: 1px;
        }
        .arena-config-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .arena-config-item label {
            font-size: 12px;
            color: #888;
        }
        .arena-config-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #aaa;
            cursor: pointer;
        }
        .arena-config-actions .arena-btn-secondary {
            font-size: 11px;
        }
        #btnConfigToggle {
            margin-left: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            color: #888;
            padding: 2px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            transition: all .15s;
        }
        #btnConfigToggle:hover {
            border-color: #fff;
            color: #fff;
        }

        /* 响应式微调 */
        @media (max-width: 640px) {
            .arena-header {
                font-size: 11px;
                padding: 4px 10px;
                flex-wrap: wrap;
                gap: 4px;
            }
            .arena-stats {
                font-size: 10px;
                flex-wrap: wrap;
            }
            .arena-modal {
                padding: 16px 16px;
                max-width: 95%;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .manage-card .details {
                grid-template-columns: 1fr 1fr;
            }
            .gun-card {
                padding: 10px 12px;
                flex-wrap: wrap;
            }
            .arena-upgrade-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .arena-upgrade-item .ug-desc {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ================================================================
        //  竞技场 - 完整游戏逻辑
        //  原 module.exports.setup 内容，直接执行
        // ================================================================

        (function() {

            /* ─── 常量 ───────────────────────────── */
            const PLAYER_RADIUS = 14
            const ENEMY_RADIUS = 16
            const BOSS_RADIUS = 30
            const MELEE_BOSS_RADIUS = 42
            const MELEE_BOSS_WINDUP = 0.7
            const MELEE_BOSS_RECOVER = 0.3
            const MELEE_ATTACKS = {
                fan: { radius: 220, halfAngle: Math.PI / 3 },
                slam: { len: 100, halfW: 110 },
                charge: { len: 420, halfW: 45 },
                dash: { len: 600, halfW: 50 },
            }
            const MELEE_ATTACK_FX_LIFE = 0.28
            const PROJECTILE_SPEED_BASE = 600
            const ENEMY_PROJECTILE_SPEED = 250
            const MAX_PIERCE = 5
            const MAX_EXTRA_ATTACK = 5
            const MAX_SPLIT_LEVEL = 3
            const MAX_LIFE_STEAL = 2.0
            const MAX_STEAL_LEVEL = 3
            const STEAL_CHANCES = [0, 0.10, 0.25, 0.50]
            const STEAL_ATK_BONUS = 0.5
            const MAX_PARALLEL = 8
            const MAX_SCATTER = 8
            const MAX_RICOCHET = 3
            const MAX_ATTACK_SPEED = 30
            const MAX_BULLET_SPEED_MULT = 10.0
            const EXTRA_BATCH_INTERVAL = 0.12
            const TURN_SPEED = 0.12
            const PARALLEL_STEP = 15
            const SCATTER_STEP = 10 * Math.PI / 180
            const STORAGE_KEY = 'toolhub_integration_arena'

            /* ─── 容器 ────────────────────────────── */
            const container = document.getElementById('app')
            if (!container) throw new Error('#app 容器不存在')

            /* ─── 音效系统 ────────────────────────── */
            let audioCtx = null

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)()
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume()
                }
            }

            function playShootSound(gun) {
                try {
                    initAudio()
                    const duration = gun.shootDuration ?? 0.05
                    const decay = gun.shootDecay ?? 6
                    const volume = gun.shootVolume ?? 0.2

                    const bufferSize = audioCtx.sampleRate * duration
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate)
                    const data = buffer.getChannelData(0)
                    for (let i = 0; i < bufferSize; i++) {
                        const t = i / audioCtx.sampleRate
                        const env = Math.exp(-t * decay)
                        data[i] = (Math.random() * 2 - 1) * env * 0.6
                    }
                    const source = audioCtx.createBufferSource()
                    source.buffer = buffer
                    const gain = audioCtx.createGain()
                    gain.gain.setValueAtTime(volume, audioCtx.currentTime)
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration)
                    source.connect(gain)
                    gain.connect(audioCtx.destination)
                    source.start()
                    source.stop(audioCtx.currentTime + duration)
                } catch (_) {}
            }

            function playHitSound(gun) {
                try {
                    initAudio()
                    const duration = gun.hitDuration ?? 0.2
                    const decay = gun.hitDecay ?? 6
                    const volume = gun.hitVolume ?? 0.4

                    const bufferSize = audioCtx.sampleRate * duration
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate)
                    const data = buffer.getChannelData(0)
                    for (let i = 0; i < bufferSize; i++) {
                        const t = i / audioCtx.sampleRate
                        const env = Math.exp(-t * decay)
                        data[i] = (Math.random() * 2 - 1) * env * 0.6
                    }
                    const source = audioCtx.createBufferSource()
                    source.buffer = buffer
                    const gain = audioCtx.createGain()
                    gain.gain.setValueAtTime(volume, audioCtx.currentTime)
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration)
                    source.connect(gain)
                    gain.connect(audioCtx.destination)
                    source.start()
                    source.stop(audioCtx.currentTime + duration)
                } catch (_) {}
            }

            function previewSound(gun) {
                if (!gun) return
                initAudio()
                playShootSound(gun)
                setTimeout(() => {
                    playHitSound(gun)
                }, 200)
            }

            function playDeathSound() {}
            function playUpgradeSound() {}

            /* ─── 枪械数据 ────────────────────────── */
            let GUNS = [{
                id: 'pistol',
                name: '手枪',
                desc: '平衡型，单发精准',
                icon: '🔫',
                color: '#88ddff',
                bulletLength: 12,
                bulletWidth: 1.5,
                atk: 2,
                range: 300,
                attackSpeed: 1,
                bulletSpeedMult: 1,
                bulletCount: 1,
                pierceCount: 0,
                extraAttackCount: 0,
                firePattern: 'single',
                spreadAngle: 0,
                burstCount: 0,
                burstDelay: 0.06,
                shootDuration: 0.05,
                shootDecay: 6,
                shootVolume: 0.2,
                hitDuration: 0.2,
                hitDecay: 6,
                hitVolume: 0.4,
            }, ]

            function genId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
            }

            /* ─── 状态 ───────────────────────────── */
            const state = {
                highestWave: 0,
                highestKills: 0,

                gameOver: false,
                paused: false,
                gamePaused: false,

                selectedGun: null,

                player: {
                    x: 0,
                    y: 0,
                    radius: PLAYER_RADIUS,
                    hp: 10,
                    maxHp: 10,
                    atk: 2,
                    atkMultiplier: 1,
                    speed: 150,
                    range: 300,
                    attackSpeed: 1,
                    attackTimer: 0,
                    level: 0,
                    totalKills: 0,
                    currentKills: 0,
                    killsForNext: 5,
                    pierceCount: 0,
                    bulletCount: 1,
                    bulletSpeedMult: 1,
                    extraAttackCount: 0,
                    _extraPending: 0,
                    _extraTimer: 0,
                    attackDirection: { x: 1, y: 0 },
                    attackEffectTimer: 0,
                    facingAngle: 0,
                    targetAngle: 0,
                    facingDir: { x: 1, y: 0 },
                    gunColor: '#88ddff',
                    bulletLength: 12,
                    bulletWidth: 1.5,
                    firePattern: 'single',
                    spreadAngle: 0,
                    burstCount: 0,
                    burstDelay: 0.06,
                    splitLevel: 0,
                    lifeSteal: 0,
                    stealLevel: 0,
                    parallelCount: 0,
                    scatterCount: 0,
                    ricochetCount: 0,
                    hurtFlashTimer: 0,
                },

                enemies: [],
                projectiles: [],
                enemyProjectiles: [],
                particles: [],
                dust: [],
                floatTexts: [],
                attackFx: [],
                ghosts: [],
                cannonballs: [],
                explosions: [],
                wave: 0,
                targetX: 0,
                targetY: 0,
                joyActive: false,
                joyDX: 0,
                joyDY: 0,

                _pendingBossRare: false,
                _stars: null,

                waveIdCounter: 0,
                currentWaveId: 0,
                waveSpawned: 0,
                waveKilled: 0,
            }

            /* ─── 持久化 ──────────────────────────── */
            function saveRecord() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        highestWave: state.highestWave,
                        highestKills: state.highestKills,
                    }))
                } catch (_) { /* ignore */ }
            }

            /* ─── DOM 构建 ────────────────────────── */
            const ui = document.createElement('div')
            ui.className = 'arena-root'
            ui.innerHTML = `
            <div class="arena-header">
              <span class="arena-title">⚡ 竞技场
                <button id="btnConfigToggle" style="margin-left:6px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#888;padding:0 8px;border-radius:3px;cursor:pointer;font-size:12px;">⚙</button>
              </span>
              <span class="arena-stats">
                总击杀 <span id="totalKillsDisplay">0</span> ｜ 波次 <span id="waveDisplay">0</span> ｜ 生命 <span id="hpDisplay">10</span>
                <button id="btnFullscreenHud" title="全屏" style="margin-left:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#888;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:12px;">⛶</button>
              </span>
            </div>
            <div class="arena-canvas-wrap">
              <canvas id="arenaCanvas"></canvas>
              <div class="joy-base" id="joyBase"><div class="joy-knob" id="joyKnob"></div></div>
              <div class="boss-bar" id="bossBar" style="display:none;"></div>
              <!-- 首页 -->

            /* ─── 画布尺寸自适应 ─────────────────── */
            let canvasW = 0,
                canvasH = 0,
                dpr = 1

            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect()
                dpr = window.devicePixelRatio || 1
                canvasW = rect.width
                canvasH = rect.height
                canvas.width = canvasW * dpr
                canvas.height = canvasH * dpr
                canvas.style.width = canvasW + 'px'
                canvas.style.height = canvasH + 'px'
                ctx.scale(dpr, dpr)

                const p = state.player
                if (state.gameOver) {
                    p.x = canvasW / 2
                    p.y = canvasH / 2
                    state.targetX = canvasW / 2
                    state.targetY = canvasH / 2
                } else {
                    const margin = 5
                    p.x = Math.max(margin, Math.min(canvasW - margin, p.x))
                    p.y = Math.max(margin, Math.min(canvasH - margin, p.y))
                    state.targetX = Math.max(0, Math.min(canvasW, state.targetX))
                    state.targetY = Math.max(0, Math.min(canvasH, state.targetY))
                }

                const maxRange = Math.min(canvasW, canvasH)
                if (p.range > maxRange) p.range = maxRange

                state._stars = null
            }

            let ro = new ResizeObserver(() => resizeCanvas())
            ro.observe(canvas.parentElement)
            setTimeout(resizeCanvas, 20)

            /* ─── 工具函数 ────────────────────────── */
            function dist(a, b) {
                return Math.hypot(a.x - b.x, a.y - b.y)
            }

            function rand(min, max) { return Math.random() * (max - min) + min }

            function randInt(min, max) { return Math.floor(rand(min, max + 1)) }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)) }

            function angleDelta(a, b) {
                let diff = b - a
                while (diff > Math.PI) diff -= Math.PI * 2
                while (diff < -Math.PI) diff += Math.PI * 2
                return diff
            }

            /* ─── 成长曲线 ────────────────────────── */
            // Boss 血量：激进指数成长
            function bossHpScale(wave) { return Math.pow(1.22, wave) }

            /* ─── 生成敌人 ────────────────────────── */
            function spawnEnemy(isBoss = false) {
                const margin = 120
                let x, y
                const side = randInt(0, 3)
                if (side === 0) { x = -margin;
                    y = rand(0, canvasH) } else if (side === 1) { x = canvasW + margin;
                    y = rand(0, canvasH) } else if (side === 2) { x = rand(0, canvasW);
                    y = -margin } else { x = rand(0, canvasW);
                    y = canvasH + margin }

                const waveFactor = 1 + state.wave * 0.15
                const speedBase = isBoss ? 40 : 40 + state.wave * 1.5
                const speed = Math.min(speedBase, isBoss ? 120 : 220)
                const hpBase = isBoss ? 30 : 3
                const hp = isBoss
                    ? Math.floor(32 * bossHpScale(state.wave))
                    : Math.floor(hpBase * waveFactor * (1 + state.wave * 0.12))
                const damageBase = isBoss ? 4 : 2
                const damage = Math.floor(damageBase * (1 + state.wave * 0.1))
                const radius = isBoss ? BOSS_RADIUS : ENEMY_RADIUS

                let type = 'melee'
                if (!isBoss) {
                    type = Math.random() < 0.3 ? 'ranged' : 'melee'
                }

                state.enemies.push({
                    x,
                    y,
                    radius,
                    hp,
                    maxHp: hp,
                    speed,
                    damage,
                    isBoss,
                    bossName: isBoss ? '👑 首领' : undefined,
                    isMeleeBoss: isBoss,
                    meleeSkills: isBoss ? ['slam', 'dash'] : undefined,
                    type,
                    attackCooldown: 0,
                    attackInterval: isBoss ? 1.2 : (type === 'ranged' ? 2.8 : 0.8),
                    rangedCooldown: 0,

                    attackAngle: 0,
                    attackType: 'slam',

                    dashTimer: 0,
                    ghostTimer: 0,

            }

            /* ─── 大型近战 Boss 攻击命中判定 ─────── */
            function meleeBossHitTest(e, p) {
                const cosA = Math.cos(e.attackAngle),
                    sinA = Math.sin(e.attackAngle)
                const lx = (p.x - e.x) * cosA + (p.y - e.y) * sinA
                const ly = -(p.x - e.x) * sinA + (p.y - e.y) * cosA
                const pad = 10
                if (e.attackType === 'fan') {
                    const r = MELEE_ATTACKS.fan.radius + pad
                    if (Math.hypot(lx, ly) > r) return false
                    return Math.abs(Math.atan2(ly, lx)) <= MELEE_ATTACKS.fan.halfAngle + 0.15
                } else if (e.attackType === 'slam') {
                    const len = MELEE_ATTACKS.slam.len + pad
                    const halfW = MELEE_ATTACKS.slam.halfW + pad
                    return lx >= -pad && lx <= len && Math.abs(ly) <= halfW
                } else {
                    const len = MELEE_ATTACKS.charge.len + pad
                    const halfW = MELEE_ATTACKS.charge.halfW + pad
                    return lx >= -pad && lx <= len && Math.abs(ly) <= halfW
                }
            }

                state.wave++

                label: '➡️ 平行弹道',
                desc: '+1 平行弹道 (上限8)',
                weight: 1.0,
                category: 'ballistic',
                apply: () => {
                    if (state.player.parallelCount < MAX_PARALLEL) {
                        state.player.parallelCount = Math.min(state.player.parallelCount + 1, MAX_PARALLEL)
                    }
                }
            }, {
                id: 'scatter',
                label: '🔀 散射弹道',
                desc: '+1 散射弹道 (上限8)',
                weight: 1.0,
                category: 'ballistic',
                apply: () => {
                    if (state.player.scatterCount < MAX_SCATTER) {
                        state.player.scatterCount = Math.min(state.player.scatterCount + 1, MAX_SCATTER)
                    }
                }
            }, ]

            function getAvailableUpgrades() {
                const p = state.player
                const maxRange = Math.min(canvasW, canvasH)
                return UPGRADE_POOL.filter(item => {
                    if (item.id === 'pierce' && p.pierceCount >= MAX_PIERCE) return false
                    if (item.id === 'extraAttack' && p.extraAttackCount >= MAX_EXTRA_ATTACK) return false
                    if (item.id === 'split' && p.splitLevel >= MAX_SPLIT_LEVEL) return false
                    if (item.id === 'lifeSteal' && p.lifeSteal >= MAX_LIFE_STEAL) return false
                    if (item.id === 'atkSteal' && p.stealLevel >= MAX_STEAL_LEVEL) return false
                    if (item.id === 'range' && p.range >= maxRange) return false
                    if (item.id === 'parallel' && p.parallelCount >= MAX_PARALLEL) return false
                    if (item.id === 'scatter' && p.scatterCount >= MAX_SCATTER) return false
                    if (item.id === 'ricochet' && p.ricochetCount >= MAX_RICOCHET) return false
                    if (item.id === 'atkSpeed' && p.attackSpeed >= MAX_ATTACK_SPEED) return false
                    if (item.id === 'bulletSpeed' && p.bulletSpeedMult >= MAX_BULLET_SPEED_MULT) return false

                    if (item.id === 'parallel' && p.scatterCount > 0) return false
                    if (item.id === 'scatter' && p.parallelCount > 0) return false
                    if (item.id === 'parallel' && p.splitLevel > 0) return false
                    if (item.id === 'split' && p.parallelCount > 0) return false
                    if (item.id === 'pierce' && p.splitLevel > 0) return false
                    if (item.id === 'split' && p.pierceCount > 0) return false
                    if (item.id === 'ricochet' && p.pierceCount > 0) return false
                    if (item.id === 'pierce' && p.ricochetCount > 0) return false
                    if (item.id === 'split' && p.ricochetCount > 0) return false
                    if (item.id === 'ricochet' && p.splitLevel > 0) return false

                    return true
                })
            }

            function getUpgradeOptions(category, count = 3, rare = false, extraIds = []) {
                const categories = Array.isArray(category) ? category : [category]
                const pool = getAvailableUpgrades().filter(item =>
                    categories.includes(item.category) || extraIds.includes(item.id))
                const shuffled = pool.slice().sort(() => Math.random() - 0.5)
                let options = shuffled.slice(0, count)

                if (rare) {
                    options = options.map(item => {
                        if (item.category === 'base') {
                            const copy = { ...item }
                            copy.label = '✨ ' + copy.label + ' (翻倍)'
                            copy.desc = copy.desc + ' ×2'
                            const originalApply = copy.apply
                            copy.apply = () => {
                                originalApply()
                                const id = item.id
                                if (id === 'atk') {
                                    const bonus = randInt(1, 3)
                                    state.player.atk += bonus
                                } else if (id === 'hp') {
                                    state.player.maxHp += 3
                                    state.player.hp = state.player.maxHp
                                } else if (id === 'range') {
                                    const maxRange = Math.min(canvasW, canvasH)
                                    const newRange = state.player.range + 15
                                    state.player.range = Math.min(newRange, maxRange)
                                } else if (id === 'atkSpeed') {
                                    if (state.player.attackSpeed < MAX_ATTACK_SPEED) {
                                        const bonus = rand(0.10, 0.25)
                                        const newSpeed = state.player.attackSpeed * (1 + bonus)
                                        state.player.attackSpeed = Math.min(MAX_ATTACK_SPEED, Math.round(newSpeed * 100) /
                                        100)
                                    }
                                } else if (id === 'bulletSpeed') {
                                    if (state.player.bulletSpeedMult < MAX_BULLET_SPEED_MULT) {
                                        const newMult = state.player.bulletSpeedMult * 1.1
                                        state.player.bulletSpeedMult = Math.min(MAX_BULLET_SPEED_MULT, Math.round(newMult *
                                            100) / 100)
                                    }
                                } else if (id === 'lifeSteal') {
                                    if (state.player.lifeSteal < MAX_LIFE_STEAL) {
                                        const bonus = rand(0.1, 0.2)
                                        state.player.lifeSteal = Math.min(state.player.lifeSteal + bonus, MAX_LIFE_STEAL)
                                        state.player.lifeSteal = Math.round(state.player.lifeSteal * 100) / 100
                                    }
                                }
                            }
                            return copy
                        } else {
                            return item
                        }
                    })
                }

                return options
            }

            function renderUpgradeUI(options, onClose) {
                upgradeList.innerHTML = ''
                options.forEach((opt, index) => {
                    const div = document.createElement('div')
                    div.className = 'arena-upgrade-item'
                    if (opt.label && opt.label.includes('✨')) {
                        div.classList.add('rare')
                    }
                    div.innerHTML = `
                <span class="ug-label">${opt.label || ''}</span>
                <span class="ug-desc">${opt.desc || ''}</span>
              `
                    div.addEventListener('click', () => {
                        opt.apply()
                        upgradeOverlay.style.display = 'none'
                        state.paused = false
                        saveRecord()
                        updateUI()
                        if (onClose) onClose()
                        setTimeout(() => checkUpgradeAndBoss(), 50)
                    })
                    upgradeList.appendChild(div)
                })
            }

            function checkUpgradeAndBoss() {
                const p = state.player
                if (p.currentKills >= p.killsForNext) {
                    p.currentKills -= p.killsForNext
                    p.level++
                    p.killsForNext = Math.floor(5 + p.level * p.level * 0.5 + state.wave * 2)
                    applyLevelUpBonus()
                    state.paused = true
                    const options = getUpgradeOptions('base', 3, false, ['extraAttack', 'ricochet'])
                    renderUpgradeUI(options, () => {
                        if (state._pendingBossRare) {
                            state._pendingBossRare = false
                            showBossUpgrade()
                        }
                    })
                    upgradeOverlay.style.display = 'flex'
                    return true
                } else {
                    if (state._pendingBossRare) {
                        state._pendingBossRare = false
                        showBossUpgrade()
                    }
                    return false
                }
            }

            function showBossUpgrade() {
                state.paused = true

                const specialBallisticPool = getAvailableUpgrades().filter(item => ['special', 'ballistic'].includes(item
                .category))
                let options = []

                if (specialBallisticPool.length >= 3) {
                    const shuffled = specialBallisticPool.slice().sort(() => Math.random() - 0.5)
                    options = shuffled.slice(0, 3)
                } else {
                    const existing = specialBallisticPool.slice().sort(() => Math.random() - 0.5)
                    const need = 3 - existing.length
                    const basePool = getAvailableUpgrades().filter(item => item.category === 'base')
                    const shuffledBase = basePool.slice().sort(() => Math.random() - 0.5)
                    const baseOptions = shuffledBase.slice(0, need)

                    const rareBaseOptions = baseOptions.map(item => {
                        const copy = { ...item }
                        copy.label = '✨ ' + copy.label + ' (翻倍)'
                        copy.desc = copy.desc + ' ×2'
                        const originalApply = copy.apply
                        copy.apply = () => {
                            originalApply()
                            const id = item.id
                            if (id === 'atk') {
                                const bonus = randInt(1, 3)
                                state.player.atk += bonus
                            } else if (id === 'hp') {
                                state.player.maxHp += 3
                                state.player.hp = state.player.maxHp
                            } else if (id === 'range') {
                                const maxRange = Math.min(canvasW, canvasH)
                                const newRange = state.player.range + 15
                                state.player.range = Math.min(newRange, maxRange)
                            } else if (id === 'atkSpeed') {
                                if (state.player.attackSpeed < MAX_ATTACK_SPEED) {
                                    const bonus = rand(0.10, 0.25)
                                    const newSpeed = state.player.attackSpeed * (1 + bonus)
                                    state.player.attackSpeed = Math.min(MAX_ATTACK_SPEED, Math.round(newSpeed * 100) /
                                    100)
                                }
                            } else if (id === 'bulletSpeed') {
                                if (state.player.bulletSpeedMult < MAX_BULLET_SPEED_MULT) {
                                    const newMult = state.player.bulletSpeedMult * 1.1
                                    state.player.bulletSpeedMult = Math.min(MAX_BULLET_SPEED_MULT, Math.round(newMult *
                                        100) / 100)
                                }
                            } else if (id === 'lifeSteal') {
                                if (state.player.lifeSteal < MAX_LIFE_STEAL) {
                                    const bonus = rand(0.1, 0.2)
                                    state.player.lifeSteal = Math.min(state.player.lifeSteal + bonus, MAX_LIFE_STEAL)
                                    state.player.lifeSteal = Math.round(state.player.lifeSteal * 100) / 100
                                }
                            }
                        }
                        return copy
                    })

                    options = [...existing, ...rareBaseOptions]
                }

                renderUpgradeUI(options, null)
                upgradeOverlay.style.display = 'flex'
            }

            /* ─── 发射子弹 ────────────────────────── */
            function fireAttackBatch(target) {
                const p = state.player
                if (!target) return

                playShootSound(state.selectedGun)

                const baseAngle = Math.atan2(target.y - p.y, target.x - p.x)
                const currentSpeed = PROJECTILE_SPEED_BASE * p.bulletSpeedMult

                const barrelLen = p.radius + 14
                const gx = p.x + Math.cos(baseAngle) * barrelLen
                const gy = p.y + Math.sin(baseAngle) * barrelLen

                const dirX = Math.cos(baseAngle)
                const dirY = Math.sin(baseAngle)
                const perpX = -Math.sin(baseAngle)
                const perpY = Math.cos(baseAngle)

                let angles = []

                if (p.parallelCount > 0) {
                    const total = 1 + p.parallelCount
                    const totalWidth = (total - 1) * PARALLEL_STEP
                    for (let i = 0; i < total; i++) {
                        const offset = -totalWidth / 2 + i * PARALLEL_STEP
                        angles.push({
                            angle: baseAngle,
                            ox: perpX * offset,
                            oy: perpY * offset
                        })
                    }
                } else if (p.scatterCount > 0) {
                    const total = 1 + p.scatterCount
                    const totalAngle = (total - 1) * SCATTER_STEP
                    for (let i = 0; i < total; i++) {
                        const angleOffset = -totalAngle / 2 + i * SCATTER_STEP
                        const a = baseAngle + angleOffset
                        angles.push({ angle: a, ox: 0, oy: 0 })
                    }
                } else {
                    angles.push({ angle: baseAngle, ox: 0, oy: 0 })
                }

                for (const b of angles) {
                    const dirX2 = Math.cos(b.angle)
                    const dirY2 = Math.sin(b.angle)
                    const startX = gx + (b.ox || 0)
                    const startY = gy + (b.oy || 0)
                    state.projectiles.push({
                        x: startX,
                        y: startY,
                        vx: dirX2 * currentSpeed,
                        vy: dirY2 * currentSpeed,
                        length: p.bulletLength || 12,
                        width: p.bulletWidth || 1.5,
                        damage: p.atk,
                        life: 2.5,
                        isHoming: true,
                        isChild: false,
                        splitRemain: p.splitLevel,
                        pierceRemain: p.pierceCount,
                        hitEnemies: new Set(),
                        radius: 6,
                        ricochetRemain: p.ricochetCount,
                        _trailTimer: 0,
                    })
                }

                p.attackDirection.x = -Math.cos(baseAngle)
                p.attackDirection.y = -Math.sin(baseAngle)
                p.attackEffectTimer = 0.12
            }

            /* ─── 粒子生成 ────────────────────────── */
            function spawnHitParticles(x, y, count = 16) {
                for (let i = 0; i < count; i++) {
                    const angle = rand(0, Math.PI * 2)
                    const speed = rand(100, 280)
                    const size = rand(3, 12)
                    const colors = ['#ffaa44', '#ff8844', '#ffcc44', '#ffffff']
                    const color = colors[randInt(0, colors.length - 1)]
                    state.particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: size,
                        life: rand(0.15, 0.45),
                        color: color,
                    })
                }
            }

            /* ─── 玩家受击火花 ────────────────────── */
            function spawnPlayerHitParticles(x, y, count = 20) {
                for (let i = 0; i < count; i++) {
                    const angle = rand(0, Math.PI * 2)
                    const speed = rand(140, 380)
                    const size = rand(2, 9)
                    const colors = ['#ff5555', '#ff7744', '#ffcc66', '#ffffff']
                    const color = colors[randInt(0, colors.length - 1)]
                    state.particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: size,
                        life: rand(0.15, 0.5),
                        color: color,
                    })
                }
            }

            /* ─── 飘浮文字 ────────────────────────── */
            function spawnFloatText(x, y, text, color) {
                state.floatTexts.push({
                    x,
                    y,
                    text,
                    color,
                    life: 0.9,
                    vy: -45,
                })
            }

            function spawnDeathPowder(x, y, count = 55) {
                for (let i = 0; i < count; i++) {
                    const angle = rand(0, Math.PI * 2)
                    const speed = rand(100, 250)
                    const offset = 8
                    const type = Math.random() < 0.5 ? 'dot' : 'line'
                    const size = type === 'dot' ? rand(0.8, 2.8) : rand(2.0, 4.5)
                    const color = `rgba(${randInt(230,255)}, ${randInt(230,255)}, ${randInt(240,255)}, 0.9)`
                    state.dust.push({
                        x: x + (Math.random() - 0.5) * offset * 2,
                        y: y + (Math.random() - 0.5) * offset * 2,
                        vx: Math.cos(angle) * speed * (0.5 + Math.random() * 0.5),
                        vy: Math.sin(angle) * speed * (0.5 + Math.random() * 0.5) - 25,
                        size: size,
                        life: rand(1.2, 2.8),
                        color: color,
                        type: type,
                        angle: angle,
                    })
                }
            }

            /* ─── 核心更新 ────────────────────────── */
            function update(dt) {
                if (state.gamePaused || state.gameOver || !state.selectedGun || state.paused) return
                const p = state.player
                const speedMult = parseFloat(speedMultSlider.value) || 1.0

                if (p.hurtFlashTimer > 0) {
                    p.hurtFlashTimer -= dt
                    if (p.hurtFlashTimer < 0) p.hurtFlashTimer = 0
                }

                if (state.joyActive && (state.joyDX !== 0 || state.joyDY !== 0)) {
                    // 移动端摇杆：方向 * 速度 持续移动
                    const joySpeed = p.speed * speedMult
                    p.x += state.joyDX * joySpeed * dt
                    p.y += state.joyDY * joySpeed * dt
                } else {
                    const dx = state.targetX - p.x
                    const dy = state.targetY - p.y
                    const distMove = Math.hypot(dx, dy)
                    if (distMove > 2) {
                        const moveSpeed = p.speed * speedMult
                        const step = Math.min(moveSpeed * dt, distMove)
                        p.x += (dx / distMove) * step
                        p.y += (dy / distMove) * step
                    }
                }
                const margin = 5
                p.x = clamp(p.x, margin, canvasW - margin)
                p.y = clamp(p.y, margin, canvasH - margin)

                let nearest = null,
                    nearDist = Infinity
                for (const e of state.enemies) {
                    const d = dist(p, e)
                    if (d < nearDist) { nearDist = d;
                        nearest = e }
                }
                let targetAngle = p.facingAngle
                if (nearest) {
                    targetAngle = Math.atan2(nearest.y - p.y, nearest.x - p.x)
                }
                p.targetAngle = targetAngle
                const diff = angleDelta(p.facingAngle, targetAngle)
                p.facingAngle += diff * Math.min(1, TURN_SPEED * dt * 60)
                p.facingDir = { x: Math.cos(p.facingAngle), y: Math.sin(p.facingAngle) }

                if (p.attackEffectTimer > 0) p.attackEffectTimer -= dt

                p.attackTimer -= dt
                if (p.attackTimer <= 0) {
                    if (nearest && nearDist < p.range) {
                        fireAttackBatch(nearest)
                        if (p.extraAttackCount > 0) {
                            p._extraPending = p.extraAttackCount
                            p._extraTimer = EXTRA_BATCH_INTERVAL
                        } else {
                            p._extraPending = 0
                            p._extraTimer = 0
                        }
                        p.attackTimer = 1 / p.attackSpeed
                    } else {
                        p.attackTimer = 0.05
                    }
                }

                if (p._extraPending > 0) {
                    p._extraTimer -= dt
                    if (p._extraTimer <= 0) {
                        let nearest2 = null,
                            nearDist2 = Infinity
                        for (const e of state.enemies) {
                            const d = dist(p, e)
                            if (d < nearDist2) { nearDist2 = d;
                                nearest2 = e }
                        }
                        if (nearest2 && nearDist2 < p.range) {
                            fireAttackBatch(nearest2)
                        }
                        p._extraPending--
                        if (p._extraPending > 0) {
                            if (p.firePattern === 'burst') {
                                p._extraTimer = p.burstDelay || 0.06
                            } else {
                                p._extraTimer = EXTRA_BATCH_INTERVAL
                            }
                        } else {
                            p._extraTimer = 0
                        }
                    }
                }

                // ---- 玩家子弹更新 ----
                for (let i = state.projectiles.length - 1; i >= 0; i--) {
                    const proj = state.projectiles[i]
                    proj.x += proj.vx * dt
                    proj.y += proj.vy * dt
                    proj.life -= dt

                    if (proj.life > 0.1) {
                        const trailCount = 1
                        for (let t = 0; t < trailCount; t++) {
                            const trailLife = rand(0.08, 0.2)
                            const size = rand(1.5, 3.5)
                            const angle = Math.atan2(proj.vy, proj.vx)
                            const offsetDist = rand(2, 6)
                            const tx = proj.x - Math.cos(angle) * offsetDist
                            const ty = proj.y - Math.sin(angle) * offsetDist
                            state.particles.push({
                                x: tx + (Math.random() - 0.5) * 3,
                                y: ty + (Math.random() - 0.5) * 3,
                                vx: (Math.random() - 0.5) * 20,
                                vy: (Math.random() - 0.5) * 20,
                                size: size,
                                life: trailLife,
                                color: 'rgba(136, 221, 255, 0.5)',
                            })
                        }
                    }

                    if (proj.isHoming && state.enemies.length > 0) {
                        let closest = null,
                            cd = Infinity
                        for (const e of state.enemies) {
                            const d = dist(proj, e)
                            if (d < cd) { cd = d;
                                closest = e }
                        }
                        if (closest) {
                            const angle = Math.atan2(closest.y - proj.y, closest.x - proj.x)
                            const speed = Math.hypot(proj.vx, proj.vy)
                            const homingStrength = proj.isChild ? 30 : 60
                            proj.vx += Math.cos(angle) * homingStrength * dt
                            proj.vy += Math.sin(angle) * homingStrength * dt
                            const curSpeed = Math.hypot(proj.vx, proj.vy)
                            if (curSpeed > speed * 1.2) {
                                proj.vx = (proj.vx / curSpeed) * speed * 1.2
                                proj.vy = (proj.vy / curSpeed) * speed * 1.2
                            }
                        }
                    }

                    for (let j = state.enemies.length - 1; j >= 0; j--) {
                        const e = state.enemies[j]
                        if (proj.hitEnemies.has(e)) continue
                        if (dist(proj, e) < proj.radius + e.radius) {
                            e.hp -= proj.damage
                            e.flashTimer = 0.2
                            playHitSound(state.selectedGun)
                            spawnHitParticles(proj.x, proj.y, 16)

                            if (p.lifeSteal > 0 && p.hp < p.maxHp) {
                                p.hp = Math.min(p.hp + p.lifeSteal, p.maxHp)
                                // 未满血时在玩家上方显示绿色数值反馈
                                spawnFloatText(p.x, p.y - p.radius - 12, '+' + p.lifeSteal.toFixed(1), '#7CFC00')
                            }

                            const knockbackStrength = 30 + proj.damage * 5
                            const angle = Math.atan2(proj.vy, proj.vx)
                            e.knockbackX = Math.cos(angle) * knockbackStrength
                            e.knockbackY = Math.sin(angle) * knockbackStrength

                            const shouldSplit = (proj.splitRemain > 0 && proj.damage > 0.3)
                            if (shouldSplit) {
                                const spreadAngle = 0.5
                                const speed = Math.hypot(proj.vx, proj.vy) * 0.9
                                const inheritedHit = new Set(proj.hitEnemies)
                                inheritedHit.add(e)
                                for (let k = 0; k < 2; k++) {
                                    const sign = k === 0 ? 1 : -1
                                    const angleOffset = sign * rand(0.1, spreadAngle)
                                    const dir = Math.atan2(proj.vy, proj.vx) + angleOffset
                                    const childDamage = Math.max(0.5, proj.damage * 0.5)
                                    const offsetLen = 2
                                    const childX = proj.x + Math.cos(dir) * offsetLen
                                    const childY = proj.y + Math.sin(dir) * offsetLen
                                    state.projectiles.push({
                                        x: childX,
                                        y: childY,
                                        vx: Math.cos(dir) * speed,
                                        vy: Math.sin(dir) * speed,
                                        length: (proj.length || 12) * 0.8,
                                        width: (proj.width || 1.5) * 0.8,
                                        damage: childDamage,
                                        life: (proj.life || 2.5) * 0.8,
                                        isHoming: true,
                                        isChild: true,
                                        splitRemain: proj.splitRemain - 1,
                                        hitEnemies: inheritedHit,
                                        radius: (proj.radius || 6) * 0.8,
                                        pierceRemain: 0,
                                        ricochetRemain: 0,
                                        _trailTimer: 0,
                                    })
                                }
                            }

                            const canRicochet = (proj.ricochetRemain > 0 && !shouldSplit)
                            if (canRicochet) {
                                let nearestEnemy = null,
                                    nearDist2 = Infinity
                                for (const other of state.enemies) {
                                    if (other === e || proj.hitEnemies.has(other)) continue
                                    const d = dist(proj, other)
                                    if (d < nearDist2) { nearDist2 = d;
                                        nearestEnemy = other }
                                }
                                if (nearestEnemy) {
                                    const newDamage = Math.max(0.1, proj.damage * 0.5)
                                    const angle2 = Math.atan2(nearestEnemy.y - proj.y, nearestEnemy.x - proj.x)
                                    const speed = Math.hypot(proj.vx, proj.vy) * 0.95
                                    const inheritedHit = new Set(proj.hitEnemies)
                                    inheritedHit.add(e)
                                    state.projectiles.push({
                                        x: proj.x,
                                        y: proj.y,
                                        vx: Math.cos(angle2) * speed,
                                        vy: Math.sin(angle2) * speed,
                                        length: proj.length,
                                        width: proj.width,
                                        damage: newDamage,
                                        life: proj.life * 0.9,
                                        isHoming: true,
                                        isChild: false,
                                        splitRemain: 0,
                                        pierceRemain: 0,
                                        hitEnemies: inheritedHit,
                                        radius: proj.radius,
                                        ricochetRemain: proj.ricochetRemain - 1,
                                        _trailTimer: 0,
                                    })
                                }
                            }

                            proj.hitEnemies.add(e)
                            if (proj.pierceRemain > 0) {
                                proj.pierceRemain--
                            } else {
                                state.projectiles.splice(i, 1)
                                break
                            }
                        }
                    }

                    if (state.projectiles[i] && (proj.life <= 0 || proj.x < -50 || proj.x > canvasW + 50 || proj.y < -50 ||
                            proj.y > canvasH + 50)) {
                        state.projectiles.splice(i, 1)
                    }
                }

                // ---- 命中粒子更新 ----
                for (let i = state.particles.length - 1; i >= 0; i--) {
                    const pt = state.particles[i]
                    pt.x += pt.vx * dt
                    pt.y += pt.vy * dt
                    pt.life -= dt
                    pt.size *= (1 - dt * 0.5)
                    if (pt.life <= 0 || pt.size < 0.5) {
                        state.particles.splice(i, 1)
                    }
                }

                // ---- 死亡粉末更新 ----
                for (let i = state.dust.length - 1; i >= 0; i--) {
                    const d = state.dust[i]
                    d.x += d.vx * dt
                    d.y += d.vy * dt
                    d.vx *= (1 - dt * 2.5)
                    d.vy *= (1 - dt * 2.5)
                    d.vx += (Math.random() - 0.5) * 6 * dt
                    d.vy += (Math.random() - 0.5) * 6 * dt - 4 * dt
                    const spd = Math.hypot(d.vx, d.vy)
                    if (spd > 80) {
                        d.vx = (d.vx / spd) * 80
                        d.vy = (d.vy / spd) * 80
                    }
                    d.life -= dt
                    const shrinkRate = d.life > 1.0 ? 0.6 : 0.15
                    d.size *= (1 - dt * shrinkRate)
                    if (d.life <= 0 || d.size < 0.2) {
                        state.dust.splice(i, 1)
                    }
                }

                // ---- 飘浮文字更新 ----
                for (let i = state.floatTexts.length - 1; i >= 0; i--) {
                    const ft = state.floatTexts[i]
                    ft.y += ft.vy * dt
                    ft.life -= dt
                    if (ft.life <= 0) {
                        state.floatTexts.splice(i, 1)
                    }
                }

                // ---- 攻击特效更新 ----
                for (let i = state.attackFx.length - 1; i >= 0; i--) {
                    const fx = state.attackFx[i]
                    fx.life -= dt
                    if (fx.life <= 0) {
                        state.attackFx.splice(i, 1)
                    }
                }

                // ---- Boss 冲刺残影更新 ----
                for (let i = state.ghosts.length - 1; i >= 0; i--) {
                    const g = state.ghosts[i]
                    g.life -= dt
                    if (g.life <= 0) {
                        state.ghosts.splice(i, 1)
                    }
                }

                // ---- 敌人更新（含击退衰减） ----
                for (const e of state.enemies) {
                    if (Math.abs(e.knockbackX) > 0.1 || Math.abs(e.knockbackY) > 0.1) {
                        e.x += e.knockbackX * dt
                        e.y += e.knockbackY * dt
                        e.knockbackX *= (1 - dt * 8)
                        e.knockbackY *= (1 - dt * 8)
                        if (Math.abs(e.knockbackX) < 0.1) e.knockbackX = 0
                        if (Math.abs(e.knockbackY) < 0.1) e.knockbackY = 0
                    }
                    if (e.flashTimer > 0) e.flashTimer -= dt
                    if (e.warn) {
                        e.warn.timer -= dt
                        if (e.warn.timer <= 0) e.warn = null
                    }
                }

                // ---- 敌人 AI ----
                for (const e of state.enemies) {
                    const dx2 = p.x - e.x,
                        dy2 = p.y - e.y,
                        d2 = Math.hypot(dx2, dy2)

                    if (e.isArtilleryBoss) {
                        // ---- 大型远程 Boss：技能状态机 ----
                        const keepDist = 320
                        if (e.skillState === 'idle') {
                            // 风筝走位：保持中距离
                            if (d2 > 1) {
                                let mx = 0,
                                    my = 0
                                if (d2 > keepDist + 80) {
                                    mx = (dx2 / d2) * e.speed * speedMult
                                    my = (dy2 / d2) * e.speed * speedMult
                                } else if (d2 < keepDist - 80) {
                                    mx = -(dx2 / d2) * e.speed * speedMult
                                    my = -(dy2 / d2) * e.speed * speedMult
                                }
                                e.x += mx * dt
                                e.y += my * dt
                            }
                            e.x = clamp(e.x, -50, canvasW + 50)
                            e.y = clamp(e.y, -50, canvasH + 50)

                            // 普通攻击：慢速圆形炮弹，延迟爆炸
                            e.normalTimer -= dt
                            if (e.normalTimer <= 0) {
                                const a = Math.atan2(dy2, dx2)
                                state.cannonballs.push({
                                    x: e.x,
                                    y: e.y,
                                    vx: Math.cos(a) * 120,
                                    vy: Math.sin(a) * 120,
                                    radius: 14,
                                    fuse: 1.2,
                                    damage: e.damage,
                                    life: 6,
                                })
                                e.normalTimer = e.normalInterval
                            }

                            // 技能调度：间隔结束 → 远离则位移，否则直接技能
                            e.skillTimer -= dt
                            if (e.skillTimer <= 0) {
                                if (d2 > 500) {
                                    e.skillState = 'move'
                                    e.moveTimer = Math.min(0.75, d2 / 420)
                                    e.moveAngle = Math.atan2(dy2, dx2)
                                    e.ghostTimer = 0
                                } else {
                                    startArtillerySkill(e)
                                }
                            }
                        } else if (e.skillState === 'move') {
                            // 位移：中短距离接近，不造成伤害，带残影
                            e.moveTimer -= dt
                            e.x += Math.cos(e.moveAngle) * 420 * dt
                            e.y += Math.sin(e.moveAngle) * 420 * dt
                            e.x = clamp(e.x, -50, canvasW + 50)
                            e.y = clamp(e.y, -50, canvasH + 50)
                            e.ghostTimer -= dt
                            if (e.ghostTimer <= 0) {
                                state.ghosts.push({ x: e.x, y: e.y, radius: e.radius, life: 0.35 })
                                e.ghostTimer = 0.03
                            }
                            if (e.moveTimer <= 0) {
                                startArtillerySkill(e)
                            }
                        } else if (e.skillState === 'skill1') {
                            // 技能1：扇形散射 1-3 波
                            e.skillTimer -= dt
                            if (e.skillTimer <= 0) {
                                const halfA = Math.PI / 3
                                const bulletCount = 20
                                for (let bi = 0; bi < bulletCount; bi++) {
                                    const a = e.skillAngle - halfA + (2 * halfA) * (bi / (bulletCount - 1))
                                    state.enemyProjectiles.push({
                                        x: e.x,
                                        y: e.y,
                                        vx: Math.cos(a) * 280,
                                        vy: Math.sin(a) * 280,
                                        radius: 5,
                                        damage: Math.max(1, e.damage - 1),
                                        life: 3,
                                    })
                                }
                                e.skillPhase--
                                if (e.skillPhase <= 0) {
                                    finishArtillerySkill(e)
                                } else {
                                    e.skillTimer = 0.3
                                }
                            }
                        } else if (e.skillState === 'skill2') {
                            // 技能2：全屏环形散射 16 颗
                            e.skillTimer -= dt
                            if (e.skillTimer <= 0) {
                                for (let bi = 0; bi < 120; bi++) {
                                    const a = (bi / 16) * Math.PI * 2
                                    state.enemyProjectiles.push({
                                        x: e.x,
                                        y: e.y,
                                        vx: Math.cos(a) * 300,
                                        vy: Math.sin(a) * 300,
                                        radius: 5,
                                        damage: Math.max(1, e.damage - 1),
                                        life: 3,
                                    })
                                }
                                finishArtillerySkill(e)
                            }
                        } else if (e.skillState === 'skill3') {
                            // 技能3：大量轰炸点——快速连续出现 15-20 个预警，再依次降落
                            if (e.bombCount > 0) {
                                e.bombSpawnTimer -= dt
                                if (e.bombSpawnTimer <= 0) {
                                    e.bombPlan.push({
                                        x: p.x + rand(-25, 25),
                                        y: p.y + rand(-25, 25),
                                        timer: 0.6,
                                    })
                                    e.bombCount--
                                    e.bombSpawnTimer = 0.2
                                }
                            }
                            // 预警依次到期 → 落弹
                            for (let bi = e.bombPlan.length - 1; bi >= 0; bi--) {
                                const bp = e.bombPlan[bi]
                                bp.timer -= dt
                                if (bp.timer <= 0) {
                                    state.cannonballs.push({
                                        kind: 'bomb',
                                        x: bp.x,
                                        y: -80,
                                        targetY: bp.y,
                                        fallSpeed: 1200,
                                        radius: 16,
                                        blastRadius: 40,
                                        damage: e.damage,
                                        tail: 0,
                                        life: 4,
                                    })
                                    e.bombPlan.splice(bi, 1)
                                }
                            }
                            // 全部预警生成且全部落下 → 技能结束
                            if (e.bombCount <= 0 && e.bombPlan.length === 0) {
                                finishArtillerySkill(e)
                            }
                        }
                    } else if (e.type === 'ranged' && !e.isBoss) {
                        const preferred = e.preferredDist
                        if (d2 < preferred - 50) {
                            const angle = Math.atan2(e.y - p.y, e.x - p.x)
                            const moveSpeed = e.speed * speedMult * 0.8
                            e.x += Math.cos(angle) * moveSpeed * dt
                            e.y += Math.sin(angle) * moveSpeed * dt
                        } else if (d2 > preferred + 50) {
                            const angle = Math.atan2(p.y - e.y, p.x - e.x)
                            const moveSpeed = e.speed * speedMult * 0.6
                            e.x += Math.cos(angle) * moveSpeed * dt
                            e.y += Math.sin(angle) * moveSpeed * dt
                        }
                        e.x = clamp(e.x, -50, canvasW + 50)
                        e.y = clamp(e.y, -50, canvasH + 50)

                        e.rangedCooldown -= dt
                        if (e.rangedCooldown <= 0 && d2 < 600) {
                            const angle = Math.atan2(p.y - e.y, p.x - e.x)
                            state.enemyProjectiles.push({
                                x: e.x,
                                y: e.y,
                                vx: Math.cos(angle) * ENEMY_PROJECTILE_SPEED,
                                vy: Math.sin(angle) * ENEMY_PROJECTILE_SPEED,
                                radius: 5,
                                damage: Math.max(1, e.damage - 1),
                                life: 3,
                            })
                            e.rangedCooldown = e.attackInterval
                        }
                    } else if (e.isMeleeBoss) {
                        // ---- 大型近战 Boss：攻击状态机 ----
                        if (e.attackState === 'idle') {
                            if (d2 > 1) {
                                const moveSpeed = e.speed * speedMult
                                const step = Math.min(moveSpeed * dt, d2)
                                e.x += (dx2 / d2) * step
                                e.y += (dy2 / d2) * step
                            }
                            e.x = clamp(e.x, -50, canvasW + 50)
                            e.y = clamp(e.y, -50, canvasH + 50)
                            e.attackTimer -= dt
                            if (e.attackTimer <= 0 && d2 < 650) {
                                e.attackAngle = Math.atan2(dy2, dx2)
                                // 按可用技能集选招（圆形 Boss 仅 slam + dash）；冲刺带冷却降频
                                const skills = e.meleeSkills || ['fan', 'slam', 'charge', 'dash']
                                if (skills.includes('dash') && d2 > 450 && e.dashCooldown <= 0) e.attackType = 'dash'
                                else if (skills.includes('charge') && d2 > 320) e.attackType = 'charge'
                                else if (skills.includes('fan') && d2 > 160) e.attackType = 'fan'
                                else e.attackType = 'slam'
                                if (e.attackType === 'dash') {
                                    e.dashLen = Math.min(d2, MELEE_ATTACKS.dash.len)
                                    e.dashTimer = 0.25
                                    e.ghostTimer = 0
                                }
                                e.attackState = 'windup'
                                e.windupTimer = MELEE_BOSS_WINDUP
                            }
                        } else if (e.attackState === 'windup') {
                            // 蓄力预警中：静止
                            e.windupTimer -= dt
                            if (e.windupTimer <= 0) {
                                if (e.attackType === 'dash') {
                                    // 冲刺：转入位移阶段
                                    e.attackState = 'dash'
                                } else {
                                    spawnMeleeAttackFx(e)
                                    if (meleeBossHitTest(e, p)) {
                                        const damageAmount = e.damage
                                        p.hp -= damageAmount
                                        p.hurtFlashTimer = 0.2
                                        // 击退玩家
                                        const kd = d2 || 1
                                        p.x += (dx2 / kd) * 110
                                        p.y += (dy2 / kd) * 110
                                        p.x = clamp(p.x, 5, canvasW - 5)
                                        p.y = clamp(p.y, 5, canvasH - 5)
                                        spawnPlayerKnockbackTrail(p.x, p.y, dx2 / kd, dy2 / kd, 110)
                                        spawnPlayerHitParticles(p.x, p.y, 22)
                                        if (p.hp <= 0) {
                                            p.hp = 0
                                            gameOver()
                                        }
                                    }
                                    e.attackState = 'recover'
                                    e.recoverTimer = MELEE_BOSS_RECOVER
                                }
                            }
                        } else if (e.attackState === 'dash') {
                            // 冲刺位移：快速冲向目标，沿途留残影
                            e.dashTimer -= dt
                            const dashSpeed = (e.dashLen || 400) / 0.25
                            e.x += Math.cos(e.attackAngle) * dashSpeed * dt
                            e.y += Math.sin(e.attackAngle) * dashSpeed * dt
